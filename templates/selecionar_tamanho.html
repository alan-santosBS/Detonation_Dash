<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Configurar Tabuleiro - Carrinho</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/icon.png') }}">
</head>

<body >
    <div class="sobre-background"></div>

    <a href="/" class="card-btn btn-iniciar btn-voltar-neon">
        <div class="card-body">
            <span class="btn-text-voltar">⬅ VOLTAR</span>
        </div>
    </a>
    <div class="card-config">
        <h2>Configurar Mapa</h2>
        <p class="subtitulo">Escolha o tamanho da grade e a dificuldade:</p>

        <!-- Seleção Rápida -->
        <div class="preset-group">
            <button type="button" class="btn-preset" data-tamanho="8" data-bombas="5" data-energias="3">Fácil (8x8)</button>
            <button type="button" class="btn-preset ativo" data-tamanho="12" data-bombas="10" data-energias="5">Médio (12x12)</button>
            <button type="button" class="btn-preset" data-tamanho="16" data-bombas="18" data-energias="8">Difícil (16x16)</button>
        </div>

        <form id="form-config" class="form-grid">
            <div class="campo-grupo">Dimensão da Matriz (N x N):</label>
                <input type="number" id="tamanho" value="10" min="5" max="16" required>
            </div>

            <div class="campo-grupo">
                <label for="bombas">Quantidade de Bombas💣:</label>
                <input type="number" id="bombas" value="6" min="1" required>
            </div>

            <div class="campo-grupo">
                <label for="energias">Cargas de Energia⚡:</label>
                <input type="number" id="energias" value="4" min="1" required>
            </div>

            <button type="submit" class="btn-gerar">Gerar Tabuleiro</button>
        </form>
    </div>

    <script>
        function aplicarPreset(tamanho, bombas, energias) {
            document.getElementById('tamanho').value = tamanho;
            document.getElementById('bombas').value = bombas;
            document.getElementById('energias').value = energias;
        }

        document.getElementById('form-config').addEventListener('submit', (e) => {
            e.preventDefault();
            fetch('/iniciar_jogo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tamanho: document.getElementById('tamanho').value,
                    bombas: document.getElementById('bombas').value,
                    energias: document.getElementById('energias').value
                })
            })
            .then(res => res.json())
            .then(dados => window.location.href = dados.redirect);
        });

        document.querySelectorAll('.btn-preset').forEach(botao => {
        botao.addEventListener('click', (e) => {
            // Remove a classe 'ativo' de todos os botões
            document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('ativo'));
            
            // Adiciona 'ativo' apenas no botão clicado
            const clicado = e.currentTarget;
            clicado.classList.add('ativo');

            // Atualiza os campos do formulário com as configurações do preset
            document.getElementById('tamanho').value = clicado.dataset.tamanho;
            document.getElementById('bombas').value = clicado.dataset.bombas;
            document.getElementById('energias').value = clicado.dataset.energias;
        });
    });
    </script>
</body>
</html>
